name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install nostrdb build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool

      - name: Show Docker + Compose versions
        run: |
          docker --version
          docker compose version

      # Bring up docker test environment FIRST, while the nostrdb tree is
      # still clean. The host-side build below dirties secp256k1's autotools
      # output with absolute host paths, which would break the docker COPY.
      # nostrdb's CGO/LMDB init crashes intermittently (~50%/boot) on the 2-CPU
      # runner (a pre-existing, self-recovering fragility tracked separately).
      # That makes `docker compose up`'s serial service_healthy gate abort when a
      # relay crashes mid-startup — regardless of the container restart policy,
      # compose gives up on the first crash rather than waiting out the restarts.
      # A fully-clean bring-up lands ~50% of the time, so retry the whole thing
      # (tearing down between) until one succeeds. --build is cached after the
      # first attempt, so retries are cheap.
      - name: Start test environment (docker compose)
        working-directory: tests
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "::group::test-start attempt $attempt"
            if make test-start; then
              echo "::endgroup::"
              echo "test environment up on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed to bring up cleanly; tearing down"
            make test-stop || true
          done
          echo "test environment failed to start cleanly after 6 attempts"
          exit 1

      # Host-side nostrdb build. Needed by `make test-run` because
      # `go test ./...` also runs tests/review, which shells out to
      # `go build ./...` on the host. Safe to run now — the docker image
      # was already built in the previous step, so dirtying secp256k1's
      # autotools tree on the host no longer affects the container build.
      - name: Build nostrdb C library for host-side go build
        run: |
          cd server/db/nostrdb
          bash build.sh

      - name: Run tests (integration + review)
        working-directory: tests
        run: make test-run

      - name: Stop test environment + collect logs
        if: always()
        working-directory: tests
        run: make test-stop

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/logs/
          if-no-files-found: ignore
          retention-days: 7
