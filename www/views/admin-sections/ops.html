{{define "admin-ops"}}
<!-- Operations: live stats + one-shot maintenance actions. The relay-identity
     fields moved to the "Relay information" section. No grain_update* method —
     stats use grain_stats_overview, refresh uses grain_refreshcache. -->
<div class="flex flex-col gap-5 mt-3">
  <!-- ─── Live stats ─────────────────────────────────────────── -->
  <fieldset class="p-3 rounded bg-surface-elevated">
    <legend class="px-2 text-sm font-medium text-text">Live stats</legend>
    <div data-ops-stats class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 text-sm">
      <div class="text-text-secondary">Loading…</div>
    </div>
    <div class="flex justify-end mt-2">
      <button
        type="button"
        data-ops-stats-refresh
        class="px-3 py-1.5 text-xs rounded border border-border-strong text-text-secondary hover:bg-surface-hover"
      >↻ refresh</button>
    </div>
  </fieldset>

  <!-- ─── Maintenance ───────────────────────────────────────── -->
  <fieldset class="p-3 rounded bg-surface-elevated">
    <legend class="px-2 text-sm font-medium text-text">Maintenance</legend>
    <p class="mt-1 mb-3 text-xs text-text-secondary">
      One-shot operations that don't require a restart.
    </p>

    <div class="flex flex-wrap gap-2">
      <button
        type="button"
        data-ops-refresh-cache
        class="px-3 py-1.5 text-sm rounded border border-border-strong text-text hover:bg-surface-hover"
      >Refresh whitelist + blacklist caches</button>
      <span class="text-xs text-text-secondary self-center">
        Forces an immediate re-pull of domain memberships and mutelist authors.
      </span>
    </div>
  </fieldset>
</div>

<script>
  (function () {
    "use strict";
    const panel = document.querySelector('[data-section="ops"]');
    if (!panel) return;
    const toast = window.adminToast || function () {};

    // ── Live stats ───────────────────────────────────────────

    const statsEl = panel.querySelector("[data-ops-stats]");
    const statsBtn = panel.querySelector("[data-ops-stats-refresh]");

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function fmtUptime(secs) {
      secs = Number(secs) || 0;
      const d = Math.floor(secs / 86400);
      const h = Math.floor((secs % 86400) / 3600);
      const m = Math.floor((secs % 3600) / 60);
      if (d > 0) return d + "d " + h + "h";
      if (h > 0) return h + "h " + m + "m";
      return m + "m";
    }

    function tile(label, value) {
      return (
        '<div class="p-2 rounded bg-surface">' +
        '<div class="text-xs text-text-secondary">' + escHtml(label) + '</div>' +
        '<div class="font-mono text-text">' + escHtml(String(value)) + '</div>' +
        '</div>'
      );
    }

    async function loadStats() {
      statsEl.innerHTML = '<div class="text-text-secondary">Loading…</div>';
      try {
        if (window.adminEnsureSigner) await window.adminEnsureSigner();
        const res = await window.grainNIP86.submit("grain_stats_overview", []);
        const srv = res.server || {};
        const wl = res.whitelist || {};
        const bl = res.blacklist || {};
        const cache = res.cache || {};
        statsEl.innerHTML =
          tile("active connections", srv.active_connections ?? 0) +
          tile("total messages sent", srv.total_messages_sent ?? 0) +
          tile("uptime", fmtUptime(srv.uptime_seconds)) +
          tile("version", srv.version || "?") +
          tile("whitelist", wl.enabled ? "enforced" : "off") +
          tile("blacklist", bl.enabled ? "enforced" : "off") +
          tile("whitelist pubkeys", (wl.pubkeys ?? 0) + (wl.npubs ?? 0)) +
          tile("whitelist domains", wl.domains ?? 0) +
          tile("blacklist pubkeys", (bl.pubkeys ?? 0) + (bl.npubs ?? 0)) +
          tile("ip blocks", bl.ip_blocks ?? 0) +
          tile("cache age (s)", cache.whitelist_age_seconds ?? "?") +
          tile("git commit", srv.git_commit || "?");
      } catch (err) {
        statsEl.innerHTML =
          '<div class="text-danger text-sm">Stats fetch failed: ' +
          escHtml(err.message || String(err)) + '</div>';
      }
    }

    statsBtn.addEventListener("click", loadStats);
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", loadStats);
    } else {
      Promise.resolve().then(loadStats);
    }
    // After claim the first load runs before the signer reconnects — re-pull the
    // stats once it's ready so the operator doesn't have to hit ↻ themselves.
    window.addEventListener("grain:signer-ready", loadStats);

    // ── Refresh cache ────────────────────────────────────────

    panel.querySelector("[data-ops-refresh-cache]").addEventListener("click", async (ev) => {
      const btn = ev.currentTarget;
      btn.disabled = true;
      try {
        if (window.adminEnsureSigner) await window.adminEnsureSigner();
        await window.grainNIP86.submit("grain_refreshcache", []);
        toast("caches refreshed");
        loadStats();
      } catch (err) {
        toast(err.message || String(err), "error");
      } finally {
        btn.disabled = false;
      }
    });
  })();
</script>
{{end}}
